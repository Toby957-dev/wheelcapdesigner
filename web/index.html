<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WheelCapDesigner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.160.0",
      "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/",
      "three-bvh-csg": "https://esm.sh/three-bvh-csg@0.0.16?external=three"
    }
  }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#1a0d06" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="#1a0d06"/></svg>
      </div>
      <div>
        <h1>WheelCapDesigner</h1>
        <p>Maße einstellen · Logo wählen · als STL / 3MF herunterladen</p>
      </div>
    </div>
    <div class="topbar-actions">
      <a class="btn btn-kofi" href="https://ko-fi.com/O8C525LFQ2" target="_blank" rel="noopener noreferrer" title="Unterstütze WheelCapDesigner auf Ko-fi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13v5a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M17 9h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M7 3v2M10.5 3v2M14 3v2"/></svg>
        <span class="kofi-txt">Kaffee spendieren</span>
      </a>
      <button class="icon-btn" id="themeToggle" title="Hell/Dunkel umschalten" aria-label="Hell/Dunkel umschalten">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <div class="mode-toggle" id="modeToggle">
        <button data-mode="standard" class="active">Standard</button>
        <button data-mode="expert">Experte</button>
      </div>
      <button class="btn btn-primary" id="download">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l4-4m-4 4l-4-4M5 21h14"/></svg>
        STL herunterladen
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="controls"></aside>
    <main class="stage">
      <canvas id="viewport"></canvas>
      <div class="badge" id="badge"></div>
      <div class="status" id="status"><span class="spinner"></span><span>berechne…</span></div>
      <div class="warn" id="warn"></div>
      <div class="hintbar">Linksklick: drehen · Rechtsklick: verschieben · Scrollen: zoomen</div>
      <div class="fatal" id="fatal"><div><h3>Konnte nicht laden</h3><p>Die 3D-Bibliothek konnte nicht geladen werden (Internetverbindung nötig).</p><code id="fatal-msg"></code></div></div>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

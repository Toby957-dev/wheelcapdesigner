<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nabendeckel-Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.160.0",
      "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/",
      "three-bvh-csg": "https://esm.sh/three-bvh-csg@0.0.16?external=three"
    }
  }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#1a0d06" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="#1a0d06"/></svg>
      </div>
      <div>
        <h1>Nabendeckel-Generator</h1>
        <p>Maße einstellen · Logo wählen · als STL herunterladen</p>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="mode-toggle" id="modeToggle">
        <button data-mode="standard" class="active">Standard</button>
        <button data-mode="expert">Experte</button>
      </div>
      <button class="btn btn-primary" id="download">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l4-4m-4 4l-4-4M5 21h14"/></svg>
        STL herunterladen
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="controls"></aside>
    <main class="stage">
      <canvas id="viewport"></canvas>
      <div class="badge" id="badge"></div>
      <div class="status" id="status"><span class="spinner"></span><span>berechne…</span></div>
      <div class="warn" id="warn"></div>
      <div class="hintbar">Linksklick: drehen · Rechtsklick: verschieben · Scrollen: zoomen</div>
      <div class="fatal" id="fatal"><div><h3>Konnte nicht laden</h3><p>Die 3D-Bibliothek konnte nicht geladen werden (Internetverbindung nötig).</p><code id="fatal-msg"></code></div></div>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
